name: Collector Validation
on:
  push:
    branches: [main]
    paths: ['*.py', 'tests/**', 'config.json', '.github/workflows/ci.yml', '.github/workflows/collect.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test deduplication and courteous request handling
        run: python -m unittest discover -s tests -v
      - name: Install Master link-check dependency
        if: env.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON != ''
        run: python -m pip install 'google-auth[requests]>=2.59.1,<3'
      - name: Verify read-only Master link
        run: python check_master_link.py
      - name: One live source check with no candidate output
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[live-check]')
        run: python smoke_test.py

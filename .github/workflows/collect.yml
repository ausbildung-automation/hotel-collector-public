name: Courteous Hotel Collection
on:
  workflow_dispatch:
  schedule:
    - cron: '47 */3 * * *'
permissions:
  contents: read
concurrency:
  group: hotel-collection-private-state
  cancel-in-progress: false
jobs:
  collect:
    if: vars.COLLECTOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRIVATE_COLLECTOR_TOKEN: ${{ secrets.PRIVATE_COLLECTOR_TOKEN }}
      GOOGLE_SHEETS_ID: 1qBViUSJvnnkagG_2XPlxSgeHQOJA4MDm0_gFKitrxcI
      GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check code without contacting websites
        run: python -m unittest discover -s tests
      - name: Collect and checkpoint only to private state
        run: python collector.py --remote --persist
      - name: Detect Master sync credentials
        id: master_sync
        shell: bash
        run: |
          if [ -n "$GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install private Master sync dependencies
        if: steps.master_sync.outputs.enabled == 'true'
        run: python -m pip install 'google-auth[requests]>=2.59.1,<3'
      - name: Verify Master link before writing
        if: steps.master_sync.outputs.enabled == 'true'
        run: python check_master_link.py
      - name: Update only the separate collector tabs in Master
        if: steps.master_sync.outputs.enabled == 'true'
        run: python sync_master.py

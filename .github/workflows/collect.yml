name: Courteous Hotel Collection
on:
  workflow_dispatch:
  schedule:
    - cron: '41 */6 * * *'
permissions:
  contents: read
concurrency:
  group: hotel-collection-private-state
  cancel-in-progress: false
jobs:
  collect:
    if: vars.COLLECTOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRIVATE_COLLECTOR_TOKEN: ${{ secrets.PRIVATE_COLLECTOR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check code without contacting websites
        run: python -m unittest discover -s tests
      - name: Collect and checkpoint only to private state
        run: python collector.py --remote --persist
      - name: Install optional private Master sync dependencies
        if: vars.MASTER_SYNC_ENABLED == 'true'
        run: python -m pip install 'google-auth[requests]>=2.59.1,<3'
      - name: Update only the separate collector tabs in Master
        if: vars.MASTER_SYNC_ENABLED == 'true'
        env:
          GOOGLE_SHEETS_ID: ${{ vars.GOOGLE_SHEETS_ID }}
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
        run: python sync_master.py

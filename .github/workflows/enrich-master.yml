name: Manual Unified Collector
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hotel-collection-private-state
  cancel-in-progress: false
jobs:
  collect:
    if: vars.COLLECTOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PRIVATE_COLLECTOR_TOKEN: ${{ secrets.PRIVATE_COLLECTOR_TOKEN }}
      GOOGLE_SHEETS_ID: 1qBViUSJvnnkagG_2XPlxSgeHQOJA4MDm0_gFKitrxcI
      GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
      - run: python -m pip install 'google-auth[requests]>=2.59.1,<3'
      - run: python production.py

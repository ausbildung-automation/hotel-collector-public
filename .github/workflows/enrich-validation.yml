name: Enricher Branch Validation

on:
  push:
    branches: [continuous-enricher-v1]
    paths:
      - 'enrich_master.py'
      - 'github_state.py'
      - 'tests/test_enrich_master.py'
      - '.github/workflows/enrich-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile enrich_master.py github_state.py
      - name: Safety tests
        run: python -m unittest tests.test_enrich_master -v
